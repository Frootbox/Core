{% set v = view.getViewHelper('\\Frootbox\\Admin\\Viewhelper\\GeneralPurpose') %}

{{ view.set({
    'title' : 'Sitemap',
}) }}

{{ front.addTab('Benutzerprofil', front.getUri('Session/Profile')) }}

<script nonce="{{ settings.nonce }}">
    $(function () {
        $('.profile-password-toggle').on('click', function () {
            const input = document.getElementById(this.getAttribute('aria-controls'));
            const showPassword = input.type === 'password';
            const label = showPassword ? 'Passwort verbergen' : 'Passwort anzeigen';

            input.type = showPassword ? 'text' : 'password';
            this.setAttribute('aria-label', label);
            this.setAttribute('title', label);
            this.innerHTML = showPassword
                ? '<i class="far fa-eye-slash fa-fw" aria-hidden="true"></i>'
                : '<i class="far fa-eye fa-fw" aria-hidden="true"></i>';
        });
    });
</script>

<h1>Benutzerprofil</h1>

<br />

<div class="row">
    <div class="col-6">

        <div class="card">
            <div class="card-body">

                <form method="post" class="ajax" action="{{ v.getUri('Session/Profile', 'ajaxUpdate') }}">

                    <div class="form-group">
                        <label for="recentPassword">aktuelles Passwort</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="recentPassword" name="recentPassword" placeholder="aktuelles Passwort" value="" autocomplete="current-password">
                            <div class="input-group-append">
                                <button type="button" class="btn btn-outline-secondary profile-password-toggle" aria-controls="recentPassword" aria-label="Passwort anzeigen" title="Passwort anzeigen">
                                    <i class="far fa-eye fa-fw" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">E-Mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="E-Mail" value="{{ user.getEmail }}">
                    </div>

                    <div class="form-group">
                        <label for="newPassword">neues Passwort</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="neues Passwort" value="" autocomplete="new-password">
                            <div class="input-group-append">
                                <button type="button" class="btn btn-outline-secondary profile-password-toggle" aria-controls="newPassword" aria-label="Passwort anzeigen" title="Passwort anzeigen">
                                    <i class="far fa-eye fa-fw" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Speichern</button>

                </form>

            </div>
        </div>

    </div>
</div>
